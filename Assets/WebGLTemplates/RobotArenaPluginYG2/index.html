<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Unity WebGL Player | {{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="./style.css">

    <!-- Yandex Games SDK -->
    <script src="/sdk.js"></script>

    <style>
        canvas:focus {
            outline: none;
        }

        html, body {
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- Additional head modules -->

</head>
<body class="{{{ SPLASH_SCREEN_STYLE.toLowerCase() }}}">

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
    </div>
    <div id="loading-cover" style="display:none;">
        <div id="unity-loading-bar">
            <div id="unity-logo"><img src="Images/logo.png"></div>
            <div id="unity-progress-bar-empty" style="display: none;">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Additional body modules -->

    <script>
        const hideFullScreenButton = "";
        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
        const config = {
            dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
            frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
            codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
            #if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
            #endif
        #if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
            #endif
        streamingAssetsUrl: "StreamingAssets",
            companyName: "{{{ COMPANY_NAME }}}",
            productName: "{{{ PRODUCT_NAME }}}",
            productVersion: "{{{ PRODUCT_VERSION }}}"
        };

        const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const spinner = document.querySelector('.spinner');

        const canFullscreen = (function () {
            for (const key of [
                'exitFullscreen',
                'webkitExitFullscreen',
                'webkitCancelFullScreen',
                'mozCancelFullScreen',
                'msExitFullscreen',
            ]) {
                if (key in document) {
                    return true;
                }
            }
            return false;
        }());

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            //config.devicePixelRatio = 1;
        }

        // The background image when loading the game. When building a build, the code changes depending on the project settings.
#if BACKGROUND_FILENAME
        var backgroundUnity = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
        loadingCover.style.background = "url('Images/background.png') center / cover";
        loadingCover.style.display = "";

        let StartUnityInstance;
        let ygGameInstance = null;
        let ysdk = null;
        let initYSDK = false;
        let initGame = false;
        let syncInit = false;
        let isVisibility = true;
        let isPausedGame = false;
        let unityStartRequested = false;
        const PLUGIN_YG2_INIT_TIMEOUT_MS = 8000;
        window.__robotArenaPluginYG2 = {
            initState: 'waiting',
            initStartedAt: null,
            initFinishedAt: null,
            timeoutMs: PLUGIN_YG2_INIT_TIMEOUT_MS,
            failureReason: '',
            capabilities: {
                loadingApi: null,
                playerData: null,
                leaderboard: null,
                fullscreenAds: null
            },
            gameReadyOutcome: 'not-requested',
            gameReadyFailureReason: ''
        };
        const NO_DATA = 'no data';

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('visibilitychange', () => SetVisibility(!document.hidden));
        window.addEventListener('blur', () => SetVisibility(false));
        window.addEventListener('focus', () => SetVisibility(true));

        window.addEventListener('pointerdown', () => {
            FocusGame();
            SetVisibility(true);
        });

        window.addEventListener('resize', () => FocusGame());
        document.addEventListener('fullscreenchange', () => FocusGame());

        const oRequestPointerLock = Element.prototype.requestPointerLock;
        Element.prototype.requestPointerLock = async function hkRequestPointerLock(...args) {
            try {
                (args[0] ||= {}).unadjustedMovement = true;
                await oRequestPointerLock.apply(this, args);
            } catch (err) {
                console.log(err);
            }
        };

        function InstallBlurFocusBlocker() {
            if (!('onblur' in document)) return;
            if (window.blurFocusHandlersInstalled) return;

            window.addEventListener('blur', function () {
                let blockerButton = document.createElement('button');
                blockerButton.style.position = 'fixed';
                blockerButton.style.top = '0';
                blockerButton.style.left = '0';
                blockerButton.style.width = '100%';
                blockerButton.style.height = '100%';
                blockerButton.style.zIndex = '9999';
                blockerButton.style.backgroundColor = 'rgba(0, 0, 0, 0)';
                blockerButton.style.border = 'none';
                blockerButton.style.cursor = 'default';

                document.body.appendChild(blockerButton);

                function removeBlocker() {
                    if (blockerButton && blockerButton.parentNode) {
                        blockerButton.parentNode.removeChild(blockerButton);
                    }
                    window.removeEventListener('focus', removeBlocker);
                }

                window.addEventListener('focus', removeBlocker);
            });

            window.blurFocusHandlersInstalled = true;
        }

        function FocusGame(checkingPauseStatus = true) {
            if (!canvas) return;

            requestAnimationFrame(() => {
                if (checkingPauseStatus && isPausedGame) return;

                const active = document.activeElement;
                if (active && (active.tagName === 'INPUT' ||
                    active.tagName === 'TEXTAREA' ||
                    active.isContentEditable
                )) {
                    return;
                }

                canvas.focus({ preventScroll: true });
            });
        }

        function SetVisibility(visibility) {
            if (ysdk !== null && initGame === true && isVisibility !== visibility) {
                isVisibility = visibility;
                if (!visibility) {
                    YG2Instance('SetFocusWindowGame', 'false');
                }
                else {
                    YG2Instance('SetFocusWindowGame', 'true');
                }
            }
        }

        const PauseCallback = () => {
            isPausedGame = true;
            LogStyledMessage('[RobotArena.PluginYG2.Transport] platform pause=true');
            YG2Instance('SetPauseGame', 'true');
            YG2Instance('RobotArenaPlatformPause', 'true');
        };

        const ResumeCallback = () => {
            isPausedGame = false;
            LogStyledMessage('[RobotArena.PluginYG2.Transport] platform pause=false');
            YG2Instance('SetPauseGame', 'false');
            YG2Instance('RobotArenaPlatformPause', 'false');
            FocusGame(false);
        };

        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            StartUnityInstance = function () {
                if (unityStartRequested) return;
                unityStartRequested = true;

                createUnityInstance(canvas, config, (progress) => {
                    spinner.style.display = "none";
                    progressBarEmpty.style.display = "";
                    const adjustedProgress = Math.max(progress, 0.05);
                    progressBarFull.style.width = `${100 * adjustedProgress}%`;
                }).then((unityInstance) => {
                    ygGameInstance = unityInstance;
                    window.unityInstance = unityInstance;
                    loadingCover.style.background = "";
                    loadingCover.style.display = "none";
                    FocusGame();
                    PublishPluginYG2RuntimeState();
                    // Fill Background [Build Modify]
                }).catch((message) => {
                    console.error(message);
                });
            };
            
            InstallBlurFocusBlocker();
            InitYSDK();
            
            if (IsLocalHost() || syncInit)
                StartUnityInstance_IfUnloaded();
        };

        function StartUnityInstance_IfUnloaded() {
            if (StartUnityInstance && spinner.style.display !== "none")
                StartUnityInstance();
        }

        function IsLocalHost() {
            try {
                if (window.top !== window) {
                    return false;
                }

                const host = window.location.hostname;
                if (host === "localhost" || host === "127.0.0.1" || host.endsWith(".local")) {
                    LogStyledMessage("Local Host");
                    return true;
                }
            } 
            catch (error) {
                console.error("Error checking the local host:", error);
                return false;
            }
        }

        function YG2Instance(method) {
            if (ygGameInstance == null)
                return;

            if (!initGame) {
                setTimeout(function () {
                    if (ygGameInstance)
                        ygGameInstance.SendMessage('YG2Instance', method);
                }, 100);
            }
            else {
                ygGameInstance.SendMessage('YG2Instance', method);
            }
                
        }
        function YG2Instance(method, arg) {
            if (ygGameInstance == null)
                return;

            if (!initGame) {
                setTimeout(function () {
                    ygGameInstance.SendMessage('YG2Instance', method, arg);
                }, 100);
            }
            else {
                ygGameInstance.SendMessage('YG2Instance', method, arg);
            }
        }

        function LogStyledMessage(message, style = 'color: #FFDF73; background-color: #454545') {
            console.log('%c' + message, style);
        }

        function SetPluginYG2InitState(state, failureReason = '') {
            if (window.__robotArenaPluginYG2.initState !== 'waiting') {
                return false;
            }

            window.__robotArenaPluginYG2.initState = state;
            window.__robotArenaPluginYG2.initFinishedAt = Date.now();
            window.__robotArenaPluginYG2.failureReason = failureReason;
            PublishPluginYG2RuntimeState();
            LogStyledMessage(
                '[RobotArena.PluginYG2.Transport] SDK init state=' + state
                + (failureReason ? '; reason=' + failureReason : ''));
            return true;
        }

        function PublishPluginYG2RuntimeState() {
            if (ygGameInstance == null) {
                return;
            }

            const capabilities = window.__robotArenaPluginYG2.capabilities || {};
            const toCapabilityState = value => value === true
                ? 'available'
                : value === false
                    ? 'unavailable'
                    : 'unknown';
            YG2Instance('RobotArenaPlatformState', JSON.stringify({
                initState: window.__robotArenaPluginYG2.initState,
                failureReason: window.__robotArenaPluginYG2.failureReason || '',
                loadingApi: toCapabilityState(capabilities.loadingApi),
                playerData: toCapabilityState(capabilities.playerData),
                leaderboard: toCapabilityState(capabilities.leaderboard),
                fullscreenAds: toCapabilityState(capabilities.fullscreenAds),
                gameReadyOutcome: window.__robotArenaPluginYG2.gameReadyOutcome,
                gameReadyFailureReason:
                    window.__robotArenaPluginYG2.gameReadyFailureReason || ''
            }));
        }

        function SetPluginYG2GameReadyOutcome(outcome, failureReason = '') {
            const lifecycle = window.__robotArenaPluginYG2;
            if (lifecycle.gameReadyOutcome === 'confirmed' ||
                lifecycle.gameReadyOutcome === 'failed') {
                return;
            }

            lifecycle.gameReadyOutcome = outcome;
            lifecycle.gameReadyFailureReason = failureReason;
            PublishPluginYG2RuntimeState();
            LogStyledMessage(
                '[RobotArena.PluginYG2.Transport] Game Ready outcome=' + outcome
                + (failureReason ? '; reason=' + failureReason : ''));
        }

        function InstallPluginYG2GameReadyObservation() {
            const loadingApi = ysdk && ysdk.features ? ysdk.features.LoadingAPI : null;
            if (!loadingApi || typeof loadingApi.ready !== 'function' ||
                loadingApi.ready.__robotArenaGameReadyObservation === true) {
                return;
            }

            const originalReady = loadingApi.ready;
            const observedReady = function (...args) {
                try {
                    const result = originalReady.apply(this, args);
                    if (result && typeof result.then === 'function') {
                        result.then(
                            () => SetPluginYG2GameReadyOutcome('confirmed'),
                            error => SetPluginYG2GameReadyOutcome(
                                'failed',
                                error && error.message ? error.message : String(error)));
                    }
                    else {
                        SetPluginYG2GameReadyOutcome('unconfirmed');
                    }

                    return result;
                }
                catch (error) {
                    const reason = error && error.message ? error.message : String(error);
                    SetPluginYG2GameReadyOutcome('failed', reason);
                    throw error;
                }
            };
            observedReady.__robotArenaGameReadyObservation = true;
            loadingApi.ready = observedReady;
        }

        function RecordPluginYG2Capabilities() {
            const features = ysdk && ysdk.features ? ysdk.features : {};
            const advertising = ysdk && ysdk.adv ? ysdk.adv : {};
            window.__robotArenaPluginYG2.capabilities = {
                loadingApi: Boolean(features.LoadingAPI &&
                    typeof features.LoadingAPI.ready === 'function'),
                playerData: Boolean(ysdk && typeof ysdk.getPlayer === 'function'),
                leaderboard: Boolean(ysdk && typeof ysdk.getLeaderboards === 'function'),
                fullscreenAds: Boolean(advertising &&
                    typeof advertising.showFullscreenAdv === 'function')
            };
            PublishPluginYG2RuntimeState();
            LogStyledMessage(
                '[RobotArena.PluginYG2.Transport] capability report='
                + JSON.stringify(window.__robotArenaPluginYG2.capabilities));
        }

        async function InitYSDK() {
            window.__robotArenaPluginYG2.initStartedAt = Date.now();
            let timeoutHandle = null;
            try {
                if (IsLocalHost()) {
                    SetPluginYG2InitState('local');
                    return;
                }

                if (typeof YaGames === 'undefined' || typeof YaGames.init !== 'function') {
                    throw new Error('YaGames.init is unavailable.');
                }

                const timeoutPromise = new Promise((resolve, reject) => {
                    timeoutHandle = setTimeout(() => {
                        const timeoutError = new Error(
                            'YaGames.init timed out after ' + PLUGIN_YG2_INIT_TIMEOUT_MS + ' ms.');
                        timeoutError.code = 'PLUGINYG2_INIT_TIMEOUT';
                        reject(timeoutError);
                    }, PLUGIN_YG2_INIT_TIMEOUT_MS);
                });

                ysdk = await Promise.race([YaGames.init(), timeoutPromise]);
                if (!ysdk || typeof ysdk.on !== 'function') {
                    throw new Error('YaGames.init returned an invalid SDK object.');
                }

                ysdk.on('game_api_pause', PauseCallback);
                ysdk.on('game_api_resume', ResumeCallback);
                InstallPluginYG2GameReadyObservation();
                RecordPluginYG2Capabilities();

                // Additional init0 modules

                // Additional init1 modules

                // Additional init2 modules

                // Additional init modules

                initYSDK = true;
                if (ygGameInstance != null)
                    ygGameInstance.SendMessage('YG2Instance', 'InitSDKComplete');

                SetPluginYG2InitState('ready');
                LogStyledMessage('[RobotArena.PluginYG2.Transport] Init YandexSDK Success');

            } catch (e) {
                const reason = e && e.message ? e.message : String(e);
                const state = e && e.code === 'PLUGINYG2_INIT_TIMEOUT' ? 'timeout' : 'failed';
                SetPluginYG2InitState(state, reason);
                console.error('[RobotArena.Platform] PluginYG2 SDK init failed: ' + reason);
            } finally {
                if (timeoutHandle !== null)
                    clearTimeout(timeoutHandle);

                if (!IsLocalHost() &&
                    (!syncInit || window.__robotArenaPluginYG2.initState !== 'ready'))
                    StartUnityInstance_IfUnloaded();
            }
        }

        function InitGame() {
            initGame = true;

            setTimeout(function () {
                if (isPausedGame == true)
                    YG2Instance('SetPauseGame', 'true');
            }, 100);

            // Additional start modules
        }

        // Additional script modules

        document.body.appendChild(script);
    </script>
</body>
</html>
